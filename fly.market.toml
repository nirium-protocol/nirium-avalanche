# Fly app for the avalanche x402 market. Deploy from the repository root:
#   fly deploy -c fly.market.toml --remote-only
# The server holds no key: NIRIUM_EVM_PAYTO is the public address that receives each sale.
app = "nirium-market-avalanche"
primary_region = "iad"

[build]
  dockerfile = "avalanche/market/Dockerfile"

[env]
  PORT = "8080"
  # Avalanche C-Chain mainnet since 27-nov-2026. Each sale is income for Nirium and settles straight to this
  # address, created for the market only (separate from the team's self-test wallets).
  NIRIUM_NETWORK = "eip155:43114"
  NIRIUM_EVM_PAYTO = "0xd488453B43Bc09398548a7EC39337e04669F0F51"
  NIRIUM_MARKET_ALLOW_MAINNET = "1"
  # Back to testnet: NIRIUM_NETWORK = "eip155:43113", the team's test payTo, and remove the line above.

[http_service]
  internal_port = 8080
  force_https = true
  # Stops when idle and starts on the first request: near zero cost with no traffic.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb" # geoip-lite (Tier A block) keeps its country data in memory; 256mb ran out (OOM, 27-nov-2026)
