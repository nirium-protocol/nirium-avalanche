version: 2
updates:
  - package-ecosystem: npm
    directory: "/avalanche"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      x402-and-solana-evm:
        patterns: ["@x402/*", "@solana/*", "viem"]
  - package-ecosystem: npm
    directory: "/avalanche/market"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      x402-and-solana-evm:
        patterns: ["@x402/*", "@solana/*", "viem"]
  - package-ecosystem: npm
    directory: "/avalanche/fuji-demo"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      x402-and-solana-evm:
        patterns: ["@x402/*", "@solana/*", "viem"]
  - package-ecosystem: npm
    directory: "/avalanche/erc8004-fuji"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      x402-and-solana-evm:
        patterns: ["@x402/*", "@solana/*", "viem"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
