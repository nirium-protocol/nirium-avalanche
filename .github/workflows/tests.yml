name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  avalanche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: |
          (cd avalanche && npm ci --no-audit --no-fund)
          (cd avalanche/fuji-demo && npm ci --no-audit --no-fund)
          (cd avalanche/erc8004-fuji && npm ci --no-audit --no-fund)
          (cd avalanche/market && npm ci --no-audit --no-fund)
      - name: Syntax
        run: for f in $(git ls-files "avalanche/*.mjs"); do node --check "$f"; done
      - name: Receipt verifier core (7 tests, no network)
        working-directory: avalanche
        run: npm run test:verify
      - name: Pre-sign policy (19 tests, no network)
        working-directory: avalanche
        run: npm run test:policy
      - name: Library (pay, charge, receipts; 9 tests, one reads the public Fuji RPC)
        working-directory: avalanche
        run: npm run test:sdk
      - name: x402 market (3 tests, no network)
        working-directory: avalanche/market
        run: npm test
      - name: Verifier against a real transaction (10 cases, public RPC)
        working-directory: avalanche
        run: npm run test:live
      - name: Package (pack, install in an empty project, import every subpath, run the bin)
        working-directory: avalanche
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/nirium-avalanche-*.tgz
          node --input-type=module -e "for (const p of ['nirium-avalanche','nirium-avalanche/policy','nirium-avalanche/policy/x402-fetch','nirium-avalanche/policy/rules','nirium-avalanche/receipt','nirium-avalanche/verify']) await import(p); console.log('imports ok')"
          npx --no-install nirium-verify-evm "$GITHUB_WORKSPACE/avalanche/../evidence/2026-11-26/fuji-a2-binding.json" | tail -1 | grep -q "RESULT: VALID"
          if tar -tzf "$RUNNER_TEMP"/nirium-avalanche-*.tgz | grep -E -i "test|example|evidence|fixture|market|demo"; then echo "unexpected files in the package"; exit 1; fi

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install (the demo uses the package from ../../avalanche, this commit's code)
        run: |
          (cd avalanche && npm ci --no-audit --no-fund)
          (cd apps/demo && npm ci --no-audit --no-fund)
      - name: Explorer logic and the CID path (10 tests, no network)
        working-directory: apps/demo
        run: npm test
      - name: Build (type check and browser bundle)
        working-directory: apps/demo
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build

  market-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the market image (same Dockerfile Fly uses)
        run: docker build -f avalanche/market/Dockerfile -t nirium-market .
      - name: Run it with the testnet config of fly.market.toml; /health must be 200 and the paid route 402
        run: |
          docker run -d --name market -p 8080:8080 -e NIRIUM_NETWORK=eip155:43113 -e NIRIUM_EVM_PAYTO=0x241d8C05f2a33F8701B933B704d329CC88367007 nirium-market
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/market)
          info=$(curl -s http://localhost:8080/v1/market/info)
          docker logs market | tail -20
          echo "paid route: $code"; echo "info: $info"
          test "$code" = 402
